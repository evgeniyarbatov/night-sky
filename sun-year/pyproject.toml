[project]
name = "sunset-sunrise-azimuth"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "ephem",
    "numpy",
    "pandas",
    "pvlib",
    "skyfield",
    "tqdm",
]

[tool.uv]
package = false


[tool.ruff]
line-length = 99
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RET", "S"]
ignore = ["E501", "B008", "S101"]


[tool.ruff.format]
quote-style = "double"


[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pvlib.*", "skyfield.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.3.260530",
    "ruff>=0.15.21",
    "types-ephem>=4.2.0.20260712",
    "types-tqdm>=4.68.0.20260608",
]
