[project]
name = "constellations"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4",
    "astropy",
    "astroplan",
    "astral",
    "matplotlib",
    "pandas",
    "numpy",
    "pytz",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
]

[tool.uv]
package = false
