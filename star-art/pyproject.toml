[project]
name = "star-art"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "skyfield",
    "pytz",
    "numpy",
    "scipy",
    "astral",
    "pandas",
    "timezonefinder",
]

[project.scripts]
star-art-render = "star_art.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
dev-mode-dirs = ["scripts"]

[tool.hatch.build.targets.wheel.sources]
"scripts" = "star_art"

[tool.hatch.build.targets.wheel.force-include]
"data/star_names.csv" = "star_art/data/star_names.csv"


[tool.ruff]
line-length = 99
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RET", "S"]
ignore = ["E501", "B008", "S101"]


[tool.ruff.format]
quote-style = "double"


[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
mypy_path = "scripts"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "skyfield.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.15.21",
    "types-pytz>=2026.2.0.20260518",
]
