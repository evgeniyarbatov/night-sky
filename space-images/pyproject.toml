[project]
name = "space-images"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
]

[tool.uv]
package = false


[tool.ruff]
line-length = 99
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RET", "S"]
ignore = ["E501", "B008", "S101", "S311"]


[tool.ruff.format]
quote-style = "double"


[tool.mypy]
python_version = "3.11"
mypy_path = "scripts"
strict = true
warn_return_any = true
warn_unused_ignores = true
